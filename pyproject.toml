[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codeloom"
version = "0.0.1"
description = "Local-first MACP hub: contracts, schemas, and types"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "CodeLoom" }]
dependencies = [
  "pydantic>=2.6.0",
  "jsonschema>=4.21.0",
  "websockets>=12.0",
  "aiohttp>=3.9.0",
]

[project.scripts]
macp = "cli.macp:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "ruff>=0.5.0",
  "black>=24.4",
  "mypy>=1.10.0",
  "bandit>=1.7.6",
  "pre-commit>=3.7.0",
  "types-jsonschema>=0.1.0",
]
bridges = [
  "mcp>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["macp_types*", "hub*", "bridges*", "cli*", "agents*"]

[tool.ruff]
target-version = "py311"
line-length = 100
select = [
  "E", "F", "I", "UP", "B", "SIM", "LOG", "S",
]
ignore = [
  # allow assert in tests
  "S101",
]

[tool.ruff.lint.isort]
known-first-party = ["macp_types", "hub", "bridges"]
combine-as-imports = true

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
check_untyped_defs = true
show_error_codes = true
pretty = true
exclude = [
  "^\\.venv/",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
